name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk BambuP1S.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BambuWidget-apk
          path: BambuP1S.apk
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BambuP1S.apk --title "Bambu P1S Widget" --notes "APK gerado automaticamente a partir de ${GITHUB_SHA::7}" --latest
